name: Build Android APK

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        run: npm ci

      - name: Create Android project
        run: npm run android:add

      - name: Prepare generated Android project
        run: |
          export VITE_APP_VERSION="0.1.${GITHUB_RUN_NUMBER}"
          npm run android:sync
          bash native-android/install.sh

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: botcraft-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure release signing
        id: signing
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_VERSION: 0.1.${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_SIGNING_BUNDLE" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No Android signing bundle set; skipping signed APK."
            exit 0
          fi
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          bundle = json.loads(os.environ['ANDROID_SIGNING_BUNDLE'])
          required = ('keystoreBase64', 'keystorePassword', 'keyAlias', 'keyPassword')
          if any(not bundle.get(key) for key in required):
              raise SystemExit('Signing bundle is missing a required field')
          Path('android/app/release-keystore.p12').write_bytes(base64.b64decode(bundle['keystoreBase64'], validate=True))
          env = os.environ.copy()
          env.update(ANDROID_KEYSTORE_PASSWORD=bundle['keystorePassword'], ANDROID_KEY_ALIAS=bundle['keyAlias'], ANDROID_KEY_PASSWORD=bundle['keyPassword'])
          subprocess.run([
              'keytool', '-importkeystore', '-noprompt',
              '-srckeystore', 'android/app/release-keystore.p12', '-srcstoretype', 'PKCS12',
              '-srcstorepass', bundle['keystorePassword'], '-srcalias', bundle['keyAlias'],
              '-destkeystore', 'android/app/release-keystore.jks', '-deststoretype', 'JKS',
              '-deststorepass', bundle['keystorePassword'], '-destkeypass', bundle['keyPassword'],
              '-destalias', bundle['keyAlias'],
          ], env=env, check=True)
          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          code = 1000 + int(os.environ['VERSION_CODE'])
          version = os.environ['RELEASE_VERSION']
          text = text.replace('versionCode 1', f'versionCode {code}', 1)
          text = text.replace('versionName "1.0"', f'versionName "{version}"', 1)
          signing_config = "    signingConfigs {\n        release {\n            storeFile file('release-keystore.jks')\n            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')\n            keyAlias System.getenv('ANDROID_KEY_ALIAS')\n            keyPassword System.getenv('ANDROID_KEY_PASSWORD')\n        }\n    }\n"
          if 'signingConfigs {' not in text:
              text = text.replace('    buildTypes {', signing_config + '    buildTypes {', 1)
          if 'signingConfig signingConfigs.release' not in text:
              text = text.replace('    buildTypes {\n        release {', '    buildTypes {\n        release {\n            signingConfig signingConfigs.release', 1)
          if 'signingConfig signingConfigs.release' not in text:
              raise SystemExit('Could not configure release APK signing')
          gradle.write_text(text)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for name in ('ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'):
                  out.write(f'{name}={env[name]}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('enabled=true\n')
          PY

      - name: Build signed APK for OTA
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print

      - name: Verify and prepare direct-download APK
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          APK_PATH="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH" || { echo 'Release APK not found'; exit 1; }
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$SDK_ROOT/build-tools"
          if [ ! -d "$BUILD_TOOLS" ]; then
            echo "Android build-tools directory not found: $BUILD_TOOLS"
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
            exit 1
          fi
          APKSIGNER="$(find "$BUILD_TOOLS" -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "Android apksigner not found under $BUILD_TOOLS"
            find "$BUILD_TOOLS" -maxdepth 2 -type f -print | head -n 50
            exit 1
          fi
          echo "Verifying $APK_PATH using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          cp "$APK_PATH" botcraft-studio.apk
          sha256sum botcraft-studio.apk

      - name: Publish direct APK download
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.${{ github.run_number }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" botcraft-studio.apk --clobber
          else
            gh release create "$RELEASE_TAG" botcraft-studio.apk \
              --target "$GITHUB_SHA" \
              --title "Botcraft Studio $RELEASE_TAG" \
              --notes "Подписанный Android APK. Скачайте APK напрямую и подтвердите установку на Android."
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/botcraft-studio.apk"
          echo "### Прямая загрузка APK" >> "$GITHUB_STEP_SUMMARY"
          echo "[$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"

      - name: Upload signed APK artifact
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: botcraft-studio-signed-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
